[package]
name = "market-maker-client-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK for connecting to the RFQ v2"
authors = ["ioanSL"]
license = "MIT"
repository = "https://github.com/jup-ag/rfq-v2-sdk"

# Explicitly exclude this package from any parent workspace
[workspace]

[dependencies]
# gRPC and Protocol Buffers
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"

# Utilities
thiserror = "1.0"
tracing = "0.1"

# Installed as the default CryptoProvider for TLS connections (see client.rs).
# default-features = false keeps the aws-lc-rs backend (and its C/asm build) out.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
solana-sdk = "2.1"
base64 = "0.21"
bincode = "1.3"
bs58 = "0.5"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fill-decoder = { path = "../fill-decoder" }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
